<!doctype html><html lang="it"><meta charset="utf-8"><title>Verifica telefono — dati dimostrativi</title><body style="margin:0;background:#060f19;color:#c7dae8;font:14px Arial"><p>Verifica visiva a 390 px — nessun dato operativo</p><iframe id="qa-phone" title="Telefono di collaudo" src="qa40.html?push=default" width="390" height="844" style="border:1px solid #36546a;max-width:100%"></iframe><details><summary>Esporta anteprima di collaudo</summary><label for="proof-data">Dati anteprima</label><textarea id="proof-data"></textarea><button id="proof-save" type="button">Salva anteprima</button><p id="proof-state" role="status"></p></details><script>document.getElementById('proof-save').onclick=()=>{try{const text=atob(document.getElementById('proof-data').value.trim()),bytes=new Uint8Array(text.length);for(let i=0;i<text.length;i++)bytes[i]=text.charCodeAt(i);const url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'})),a=document.createElement('a');a.href=url;a.download='QA-PWA40-CONFERMA.jpg';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);document.getElementById('proof-state').textContent='Anteprima esportata';}catch(e){document.getElementById('proof-state').textContent='Anteprima non valida';}};</script></body></html>
